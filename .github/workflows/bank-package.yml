name: Bank inventory binary package
on:
  push:
    branches: [bank-self-run-guide]
    paths: ['.github/workflows/bank-package.yml']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bank-inventory-package
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Linux amd64 package
        run: |
          mkdir -p package dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o package/cbomkit-theia .
          cp tools/check_handover_cbom.py package/
          cp tools/run-bank-inventory.sh package/run-inventory.sh
          cp docs/bank-self-run.md package/README.md
          cp LICENSE package/
          if [ -f NOTICE ]; then cp NOTICE package/; fi
          git rev-parse HEAD > package/REVISION
          chmod 755 package/run-inventory.sh
          tar -C package -czf dist/q2quantum-inventory-linux-amd64-v0.1.0.tar.gz .
          (cd dist && sha256sum q2quantum-inventory-linux-amd64-v0.1.0.tar.gz > SHA256SUMS)
      - name: Verify checksum and test the extracted distribution
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          mkdir extracted
          tar -xzf dist/q2quantum-inventory-linux-amd64-v0.1.0.tar.gz -C extracted
          BANK_PACKAGE_DIR="$PWD/extracted" bash tools/test_bank_self_run.sh
          cp bank-self-run-validation.json dist/
          cp package/REVISION dist/REVISION
      - name: Publish tested pilot package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create bank-pilot-v0.1.0 --target "$GITHUB_SHA" --prerelease \
            --title 'Bank inventory pilot v0.1.0 — Linux amd64' \
            --notes 'Prebuilt local file inventory. No build tools, API keys or hosted service required. Requires Linux x86-64 (or WSL), Python 3.11+ and OpenSSL. Verify SHA256SUMS; follow the enclosed README. Tested on synthetic keys only. This is not a compliance certification or a guarantee that all algorithms or secret formats are detected.' \
            dist/q2quantum-inventory-linux-amd64-v0.1.0.tar.gz dist/SHA256SUMS dist/REVISION dist/bank-self-run-validation.json
